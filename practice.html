<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Code Trainer_ | Master Code Typing at Pro Speed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            emerald: '#10b981',
                            dark: '#070a13',
                            surface: '#0f1628',
                            card: '#131c33',
                            border: '#1e2b48'
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'Fira Code', 'Consolas', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 30px -4px rgba(0, 242, 254, 0.45)',
                        'neon-purple': '0 0 30px -4px rgba(139, 92, 246, 0.45)',
                        'glow-lg': '0 0 60px -15px rgba(0, 242, 254, 0.3)'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a13;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* Ambient Grid */
        .bg-tech-grid {
            background-image: radial-gradient(rgba(30, 41, 59, 0.45) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Cursor Blink */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .blinking-cursor {
            animation: blink 1s infinite;
        }

        /* ================= 3D VECTOR KEYBOARD BACKGROUND (Zero Pixelation / 60 FPS) ================= */
        .viewport-3d {
            perspective: 1200px;
            perspective-origin: 50% 30%;
        }

        .keyboard-plane {
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-24deg) translateY(0px);
            transition: transform 0.08s ease-out;
            will-change: transform;
        }

        .key-cap-3d {
            position: relative;
            background: linear-gradient(180deg, #162035 0%, #0d1424 100%);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.15);
            border-bottom: 2px solid #050811;
            border-radius: 8px;
            box-shadow: 0 6px 0 #050811, 0 10px 18px rgba(0, 0, 0, 0.6);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
        }

        .key-cap-3d.active-glow {
            border-color: #00f2fe;
            box-shadow: 0 6px 0 #0284c7, 0 0 25px rgba(0, 242, 254, 0.6), inset 0 0 12px rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }

        /* ================= SPOTLIGHT CARD HOVER EFFECT ================= */
        .glow-card {
            position: relative;
            background: rgba(19, 28, 51, 0.65);
            border-radius: 1.25rem;
            backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
            border: 1px solid rgba(30, 43, 72, 0.8);
        }

        .glow-card::before {
            content: '';
            position: absolute;
            top: var(--mouse-y, -1000px);
            left: var(--mouse-x, -1000px);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle closest-side, rgba(0, 242, 254, 0.18), transparent 80%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .glow-card:hover::before {
            opacity: 1;
        }

        .glow-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7), 0 0 30px -5px rgba(0, 242, 254, 0.2);
        }

        /* Language tab transition */
        .lang-button {
            transition: all 0.2s ease;
        }
        .lang-button.active {
            background: rgba(0, 242, 254, 0.12);
            border-color: #00f2fe;
            color: #00f2fe;
            box-shadow: 0 0 22px -3px rgba(0, 242, 254, 0.45);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #070a13;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
