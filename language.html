// 2. ฟังก์ชันอ่านค่า Parameter จาก URL และเปลี่ยนโจทย์ทันทีที่เปิดหน้า
function loadPracticeFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang');     // เช่น 'html'
    const lesson = urlParams.get('lesson'); // เช่น 'script_tags'

    if (lang && lesson && practiceDatabase[lang] && practiceDatabase[lang][lesson]) {
        const targetCode = practiceDatabase[lang][lesson];
        
        // เรียกฟังก์ชันสำหรับอัปเดตข้อความในหน้า Practice ของคุณ
        // (ให้เปลี่ยนเป็นชื่อฟังก์ชันหรือ ID Element ที่ใช้ในโค้ด practice.html ของคุณ)
        if (typeof setTargetText === 'function') {
            setTargetText(targetCode);
        } else {
            // กรณีเป็น Element ตรงๆ เช่น <div id="codeDisplay">
            const codeDisplay = document.getElementById('codeDisplay') || document.querySelector('.typing-text-container');
            if (codeDisplay) {
                codeDisplay.innerText = targetCode;
            }
        }

        // อัปเดตชื่อบทเรียนบน Header (ถ้ามี)
        const lessonTitleElement = document.getElementById('lessonTitle');
        if (lessonTitleElement) {
            lessonTitleElement.textContent = `${lang.toUpperCase()} | ${lesson.replace('_', ' ')}`;
        }
    }
}

// ทำงานทันทีเมื่อโหลดหน้าเว็บสำเร็จ
document.addEventListener('DOMContentLoaded', loadPracticeFromURL);
